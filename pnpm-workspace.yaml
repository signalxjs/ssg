packages:
  - packages/*
  - examples/*

# Core sigx packages are pinned to a single minor (^X.Y.0) via a catalog so
# every workspace package's runtime resolves the SAME @sigx/reactivity copy —
# two copies on the app/runtime line break reactivity. (A dev-only older copy
# may still appear under the @sigx/cli → @sigx/terminal toolchain; that is
# isolated from the ssg runtime and unaffected by this catalog.) @sigx/router
# is a SIBLING, not core: it tracks its own release line and `pnpm sync:core`
# does not touch it, so bump it by hand to the release aligned to the same core
# minor as the entries above.
# `catalog:` refs rewrite to these concrete ranges on `pnpm pack`/publish
# (deps, devDeps, and peerDeps alike).
catalog:
  sigx: ^0.15.2
  '@sigx/server-renderer': ^0.15.2
  '@sigx/vite': ^0.15.2
  '@sigx/router': ^0.12.0

onlyBuiltDependencies:
  - esbuild
